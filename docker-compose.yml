services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: graphguard
      POSTGRES_USER: graphguard
      POSTGRES_PASSWORD: graphguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphguard -d graphguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://graphguard:graphguard@postgres:5432/graphguard
      JWT_SECRET: codespaces-change-this-secret
      ML_SERVICE_URL: http://ml-service:8000
      PORT: 4000
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:4000
    environment:
      API_PROXY_TARGET: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
